# مرصد الدهان — Cloudflare Worker + D1 + static pages. Deployed by Cloudflare Workers Builds on every push to main
# (root directory /cloudflare, deploy command «npx wrangler deploy»).
name = "marsad"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../sites/public"
binding = "ASSETS"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "marsad"
database_id = "9d084dda-233d-47be-b901-56f8e911a4d4"   # created 11-17 from the dashboard

[vars]
MARSAD_NO_SETUP = "1"   # the main password comes only from the move page (/move/)
MARSAD_SHADOW = "0"   # the live server since 11-19 (Karim); "1" = a trial copy with no background work
MARSAD_ADOPT_FROM = "https://marsad-v2.karim87nu.chatgpt.site"   # the cashier PC key is checked there once

[observability]
enabled = true
