<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>موصل إدارة أرابيكس</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:clamp(18px,4vw,48px);font:clamp(18px,2vw,22px) Tahoma,Arial,sans-serif;line-height:1.8;background:#0d1b2c;color:#fff}
    main{width:min(100%,900px);margin:0 auto;padding:clamp(20px,4vw,40px);border:1px solid #294b63;border-radius:18px;background:#11243a;box-shadow:0 18px 55px #0004}
    h1{margin:0 0 16px;font-size:clamp(26px,4vw,36px)}
    p{color:#d5e0ea;margin:14px 0}
    #message{white-space:pre-line;min-height:3em;padding:16px;border-radius:12px;background:#0b1a29;border:1px solid #294b63}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
    button{min-height:54px;padding:12px 24px;font:inherit;font-weight:700;border-radius:10px;background:#28d7b0;border:0;color:#07111f;cursor:pointer}
    button.secondary{background:#20384e;color:white;border:1px solid #42617a}
    button:focus-visible{outline:3px solid #83f0dc;outline-offset:3px}
    @media(max-width:600px){body{padding:12px}main{min-height:calc(100vh - 24px);padding:20px 16px;border-radius:14px}.actions{display:grid;grid-template-columns:1fr}button{width:100%}}
  </style>
</head>
<body>
  <main>
    <h1>موصل إدارة أرابيكس</h1>
    <p>المزامنة تتفعّل تلقائيًا عند تسجيل دخولك إلى صفحة الإدارة. لا تكتب باسورد الإدارة هنا؛ الإضافة لا تحفظه. يجب أن يكون Firefox مفتوحًا ومسجلًا في أرابيكس حتى يلتقط اللايف والسجل، وتستأنف المزامنة وحدها عند إعادة فتحه.</p>
    <p id="message" role="status" aria-live="polite">جارٍ التحقق من حالة المزامنة…</p>
    <div class="actions"><button id="sync" class="secondary">مزامنة الآن</button><button id="stop" class="secondary">إيقاف المزامنة التلقائية</button></div>
  </main>
  <script src="collector.js"></script>
</body>
</html>
