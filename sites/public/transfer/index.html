<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مرصد الدهان — تحويل الأوردرات</title>
<style>
@font-face{font-family:"Plex Arabic";src:url(../admin/fonts/plex-arabic-arabic-400.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Plex Arabic";src:url(../admin/fonts/plex-arabic-arabic-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Plex Arabic";src:url(../admin/fonts/plex-arabic-latin-400.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Plex Arabic";src:url(../admin/fonts/plex-arabic-latin-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}
:root{--bg:#081120;--panel:#0f1d33;--panel2:#13243f;--line:#1f3354;--text:#e2e8f0;--muted:#94a3b8;--accent:#2dd4bf;--on:#04201c;--tal:#ff7a00;--site:#38bdf8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Plex Arabic",Tahoma,Arial,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--on);font-weight:700;min-height:36px}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.on{background:var(--panel2);color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#0b1729;color:var(--text);min-height:38px}
header{position:sticky;top:0;z-index:5;background:#081120ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:18px;margin:0 0 0 auto}
.pill{border-radius:999px;padding:3px 10px;font-size:13px;border:1px solid var(--line);color:var(--muted)}
.pill.off{border-color:#7f1d1d;color:#fca5a5}
main{max-width:1100px;margin:0 auto;padding:16px}
#login{max-width:340px;margin:12vh auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:grid;gap:12px;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.count{color:var(--muted);font-size:13px;margin-inline-start:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;display:grid;gap:10px}
.card.done{opacity:.6}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.src{font-weight:700;border-radius:6px;padding:2px 8px;font-size:13px}
.src.talabat{background:#ff7a0022;color:var(--tal)} .src.site{background:#38bdf822;color:var(--site)}
.code{font-size:20px;font-weight:700;letter-spacing:.5px}
.state{margin-inline-start:auto;font-weight:700;font-size:14px}
.state.in{color:var(--ok)} .state.wait{color:var(--warn)} .state.mine{color:var(--accent)} .state.other{color:var(--bad)}
.label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel2);border-radius:10px;padding:8px 10px}
.label input{flex:1;min-width:200px;font-weight:700;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.box{background:#0b1729;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.box h3{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:400}
.items{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.items li{background:#0b1729;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.mods{color:var(--muted);font-size:13px}
.apex{font-size:13px} .apex.none{color:var(--warn)}
.warn{color:var(--warn);font-size:13px} .bad{color:var(--bad)} .ok{color:var(--ok)}
.pay{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.copy{padding:4px 10px;min-height:30px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px}
#toast{position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:auto;background:#7f1d1d;color:#fff;padding:10px 14px;border-radius:10px;display:none}
@media (max-width:600px){header h1{font-size:16px}.code{font-size:18px}}
</style>
</head>
<body>
<section id="login" hidden>
  <h2 style="margin:0">تحويل الأوردرات للفروع</h2>
  <div style="color:var(--muted);font-size:14px">ادخل برقمك السري بتاع الشغل</div>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="الرقم السري">
  <button id="go">دخول</button>
  <div id="loginErr" class="bad" style="font-size:14px"></div>
</section>
<div id="app" hidden>
  <header>
    <h1>تحويل أوردرات طلبات والموقع</h1>
    <span id="auto" class="pill off" title="الصفحة دي مش بتكتب على Apex">التحويل الآلي متوقف لحد ما يتأكد — سجّل على Apex بإيدك</span>
    <span id="me" class="pill"></span>
    <button class="ghost" id="out">خروج</button>
  </header>
  <main>
    <div class="bar">
      <button data-f="todo" class="on">لسه ماتسجلش</button>
      <button data-f="all" class="ghost">الكل</button>
      <span style="width:12px"></span>
      <button data-s="" class="on">الكل</button>
      <button data-s="talabat" class="ghost">طلبات</button>
      <button data-s="site" class="ghost">الموقع</button>
      <span class="count" id="count"></span>
    </div>
    <div id="list"></div>
  </main>
</div>
<div id="toast"></div>
<script>
'use strict';
const API = '';
let token = null, data = null, filter = 'todo', source = '', choice = {}, picks = {};
try { token = sessionStorage.getItem('marsadTransfer'); } catch {}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n == null ? '' : Number(n).toLocaleString('ar-EG-u-nu-latn', { maximumFractionDigits: 2 });
const time = s => s ? new Date(s).toLocaleTimeString('ar-EG-u-nu-latn', { hour: 'numeric', minute: '2-digit', timeZone: 'Africa/Cairo' }) : '';
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 4000); }
async function api(method, path, body) {
  const r = await fetch(API + path, { method, headers: { 'content-type': 'application/json', ...(token ? { 'x-transfer-session': token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/api/transfer/login') { logout(); throw new Error('سجل دخول تاني'); }
  if (!r.ok) throw new Error(j.error || 'حصل خطأ');
  return j;
}
function logout() { token = null; try { sessionStorage.removeItem('marsadTransfer'); } catch {} $('app').hidden = true; $('login').hidden = false; }
$('go').onclick = async () => {
  $('loginErr').textContent = '';
  try { const r = await api('POST', '/api/transfer/login', { pin: $('pin').value.trim() }); token = r.token; try { sessionStorage.setItem('marsadTransfer', token); } catch {} $('pin').value = ''; boot(); }
  catch (e) { $('loginErr').textContent = e.message; }
};
$('pin').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('out').onclick = logout;
document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; document.querySelectorAll('[data-f]').forEach(x => x.className = x === b ? 'on' : 'ghost'); render(); });
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { source = b.dataset.s; document.querySelectorAll('[data-s]').forEach(x => x.className = x === b ? 'on' : 'ghost'); render(); });

// What the employee writes next to the customer name on Apex.
function labelOf(o, pay) {
  const tag = o.code ? ' #' + o.code : '';
  if (o.source === 'talabat') return (pay === 'paid' ? 'مدفوع' : pay === 'cash' ? 'اطلب/كاش' : '؟؟') + tag;
  return (pay === 'paid' ? 'مدفوع' : pay === 'cash' ? 'كاش' : '؟؟') + ' موقع' + tag;
}
const key = o => o.source + ':' + o.ref;
function stateOf(o) {
  if (o.apex) return { cls: 'in', text: 'في Apex ✓ ' + (o.apex.sn ? 'رقم ' + o.apex.sn : '#' + o.apex.no) + (o.apex.user ? ' — ' + o.apex.user : '') };
  const r = o.job?.result;
  if (o.job?.state === 'auto_pending') return { cls: 'wait', text: 'مستني كاتب Apex…' };
  if (o.job?.state === 'auto_sending') return { cls: 'wait', text: 'بيتكتب على Apex…' };
  if (o.job?.state === 'auto_done') return { cls: 'in', text: 'اتكتب آليًا' + (r?.db === 'test' ? ' (قاعدة الاختبار)' : '') + ' #' + (r?.shiftSerial ?? r?.orderNo ?? '') + (r?.error ? ' — ' + r.error : '') };
  if (o.job?.state === 'auto_failed') return { cls: 'other', text: 'التحويل الآلي ماتمش: ' + (r?.error || '') + ' — سجله بإيدك' };
  if (o.job?.state === 'auto_preview') return { cls: r?.ok ? 'wait' : 'other', text: 'معاينة بس (إجمالي Apex ' + money(r?.total) + ')' + (r?.error ? ' — ' + r.error : '') + ' — سجله بإيدك' };
  if (o.job?.state === 'entered') return { cls: 'wait', text: (o.job.mine ? 'إنت سجلته' : o.job.by + ' سجله') + ' — مستني يظهر في Apex' };
  if (o.job?.state === 'claimed') return o.job.mine ? { cls: 'mine', text: 'معاك دلوقتي' } : { cls: 'other', text: 'مع ' + o.job.by };
  return { cls: '', text: 'جديد' };
}
function payText(o) {
  if (o.payment === 'cash') return '<span class="ok">كاش (من بيانات الأوردر)</span>';
  if (o.payment === 'paid') return '<span class="ok">مدفوع (من بيانات الأوردر)</span>';
  if (o.payment === 'unpaid') return '<span class="bad">أونلاين ولسه مادفعش — ماتسجلوش قبل الدفع</span>';
  return '<span class="warn">طريقة الدفع مش واضحة من المصدر — بص على الأوردر واختار</span>';
}
function discountsHtml(o) {
  if (!o.discounts?.length) return '<span style="color:var(--muted)">مفيش خصم ظاهر</span>';
  return o.discounts.map(d => {
    const where = d.who === 'platform' ? '<span class="ok">خصم طلبات ← يتكتب في العلامة المميزة، مايتخصمش</span>'
      : d.who === 'restaurant' ? '<span class="ok">خصم المطعم ← يتخصم</span>' : '<span class="warn">مين ممول الخصم مش واضح — راجع قبل ما تسجل</span>';
    return '<div>' + esc(d.text) + (d.amount != null ? ' — ' + money(d.amount) : '') + '<br>' + where + '</div>';
  }).join('');
}
function itemsHtml(o) {
  if (!o.items?.length) return '<div class="warn">' + (o.detailRead ? 'مفيش أصناف' : 'تفاصيل الأوردر لسه ماتقرتش — افتحه على ' + (o.source === 'talabat' ? 'طلبات' : 'الموقع')) + '</div>';
  return '<ul class="items">' + o.items.map(i => '<li><b>' + esc(i.qty) + '×</b> ' + esc(i.name) + (i.price != null ? ' <span style="color:var(--muted)">(' + money(i.price) + ')</span>' : '') +
    (i.modifiers?.length ? '<div class="mods">إضافات: ' + i.modifiers.map(esc).join('، ') + '</div>' : '') +
    (o.source === 'talabat' && !i.modifiersComplete ? '<div class="warn">الإضافات ماتقرتش كاملة — راجعها على طلبات</div>' : '') +
    (o.source === 'talabat' ? (i.apex?.length ? '<div class="apex">على Apex: ' + i.apex.map(a => esc(a.no) + (a.name ? ' ' + esc(a.name) : '')).join(' أو ') + (i.apex.length > 1 ? ' <span class="warn">(اختار الحجم الصح)</span>' : '') + '</div>'
      : '<div class="apex none">مش مربوط بصنف Apex لسه — اختاره من المنيو</div>') : '') + '</li>').join('') + '</ul>';
}
// Automatic transfer: branch and Apex item for each line, confirmed by the employee (nothing is guessed).
function autoHtml(o) {
  const mode = data.autoTransfer;
  if (!mode || mode === 'off' || o.apex || /^auto_(?:pending|sending|done|preview)$/.test(o.job?.state || '')) return '';
  const k = key(o), p = picks[k] || (picks[k] = { branch: o.apexBranch || '', items: (o.items || []).map(i => i.apex?.length === 1 ? i.apex[0].no : '') });
  const br = '<select data-pick="branch"><option value="">فرع Apex…</option>' + (data.branches || []).map(b => '<option value="' + b.no + '"' + (String(p.branch) === String(b.no) ? ' selected' : '') + '>' + esc(b.name) + '</option>').join('') + '</select>';
  // Delivery area on Apex (decides the delivery service charge), only the chosen branch's areas.
  const areas = (data.locations || []).filter(l => !p.branch || l.branch == null || String(l.branch) === String(p.branch)).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  const loc = '<select data-pick="loc"><option value="">منطقة العميل على Apex…</option>' + areas.map(l => '<option value="' + l.no + '"' + (String(p.loc) === String(l.no) ? ' selected' : '') + '>' + esc(l.name) + (l.service != null ? ' (خدمة ' + money(l.service) + ')' : '') + '</option>').join('') + '</select>';
  const lines = (o.items || []).map((i, n) => '<div class="pay" style="margin-top:4px"><span>' + esc(i.qty) + '× ' + esc(i.name) + (i.modifiers?.length ? ' (' + i.modifiers.map(esc).join('، ') + ')' : '') + '</span> ' +
    (i.apex?.length > 1 ? '<select data-pick="item" data-n="' + n + '"><option value="">اختار…</option>' + i.apex.map(a => '<option value="' + esc(a.no) + '"' + (p.items[n] === a.no ? ' selected' : '') + '>' + esc(a.no) + (a.name ? ' ' + esc(a.name) : '') + '</option>').join('') + '</select>' : '') +
    '<input data-pick="item" data-n="' + n + '" inputmode="numeric" placeholder="رقم الصنف على Apex" style="width:150px" value="' + esc(p.items[n] || '') + '"></div>').join('');
  const label = mode === 'shadow' ? 'معاينة آلية (من غير كتابة)' : mode === 'test' ? 'تحويل آلي (قاعدة الاختبار)' : 'تحويل آلي لـApex';
  return '<details class="box"' + (p.open ? ' open' : '') + ' data-pick-box><summary>' + label + '</summary><div class="pay" style="margin-top:6px"><span>الفرع على Apex:</span> ' + br + '</div>' + lines +
    '<div class="actions" style="margin-top:8px"><button data-act="auto">' + label + '</button></div></details>';
}
function card(o) {
  const st = stateOf(o), pay = choice[key(o)] || o.job?.payment || (o.payment === 'cash' || o.payment === 'paid' ? o.payment : null);
  const mineOrFree = !o.job || o.job.mine || o.job.state === 'released';
  const done = !!o.apex;
  return '<div class="card' + (done ? ' done' : '') + '" data-k="' + esc(key(o)) + '">' +
    '<div class="top"><span class="src ' + o.source + '">' + (o.source === 'talabat' ? 'طلبات' : 'الموقع') + '</span><span class="code">' + (o.code ? '#' + esc(o.code) : esc(o.ref)) + '</span>' +
      '<span style="color:var(--muted)">' + time(o.at) + ' · ' + esc(o.branch || 'الفرع مش معروف') + (o.deliveryType ? ' · ' + esc(o.deliveryType) : '') + (o.scheduled ? ' · <span class="warn">بميعاد</span>' : '') + '</span>' +
      '<span class="state ' + st.cls + '">' + esc(st.text) + '</span></div>' +
    '<div class="label"><span style="color:var(--muted)">جنب اسم العميل:</span><input readonly value="' + esc((o.customer?.name ? o.customer.name + ' ' : '') + labelOf(o, pay)) + '"><button class="ghost copy" data-copy>نسخ</button></div>' +
    '<div class="pay"><span>الدفع:</span> ' + payText(o) + ' <button class="' + (pay === 'cash' ? 'on' : 'ghost') + ' copy" data-pay="cash">كاش</button><button class="' + (pay === 'paid' ? 'on' : 'ghost') + ' copy" data-pay="paid">مدفوع</button></div>' +
    '<div class="grid">' +
      '<div class="box"><h3>العميل</h3>' + esc(o.customer?.name || '—') + '<br>' + (o.customer?.phone ? esc(o.customer.phone) + ' <button class="ghost copy" data-copytext="' + esc(o.customer.phone) + '">نسخ</button>' : '<span class="warn">الرقم مش ظاهر</span>') + '</div>' +
      '<div class="box"><h3>العنوان</h3>' + (o.customer?.address ? esc(o.customer.address) : '<span class="warn">العنوان مش ظاهر — خده من الأوردر</span>') + '</div>' +
      '<div class="box"><h3>الخصم</h3>' + discountsHtml(o) + '</div>' +
      '<div class="box"><h3>القيم</h3>' + (o.subtotal != null ? 'قبل الخصم: ' + money(o.subtotal) + '<br>' : '') + (o.total != null ? 'الإجمالي: ' + money(o.total) : '') + (o.shipping ? '<br>توصيل: ' + money(o.shipping) : '') + (o.paymentTitle ? '<br>' + esc(o.paymentTitle) : '') + '</div>' +
    '</div>' +
    (o.note ? '<div class="box"><h3>ملاحظة العميل</h3>' + esc(o.note) + '</div>' : '') +
    (o.bill?.length ? '<details><summary style="color:var(--muted);font-size:13px">الفاتورة زي ما طلبات كاتباها</summary>' + o.bill.map(b => '<div style="font-size:13px">' + esc(b.text) + '</div>').join('') + '</details>' : '') +
    itemsHtml(o) + autoHtml(o) +
    (done ? '' : '<div class="actions">' +
      (!o.job || o.job.state === 'released' ? '<button data-act="claim">أنا هسجله</button>' : '') +
      (mineOrFree ? '<button data-act="entered">اتسجل على Apex</button>' : '') +
      (o.job?.mine && o.job.state !== 'released' ? '<button class="ghost" data-act="release">سيبه</button>' : '') +
      '</div>') +
  '</div>';
}
function render() {
  if (!data) return;
  const list = data.orders.filter(o => (!source || o.source === source) && (filter === 'all' || !o.apex));
  const todo = data.orders.filter(o => !o.apex).length;
  $('count').textContent = 'لسه: ' + todo + ' · الكل: ' + data.orders.length;
  $('list').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">مفيش أوردرات هنا دلوقتي</div>';
}
$('list').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const c = b.closest('.card'), o = data.orders.find(x => key(x) === c.dataset.k); if (!o) return;
  if (b.dataset.copy !== undefined || b.dataset.copytext) {
    const text = b.dataset.copytext || c.querySelector('.label input').value;
    try { await navigator.clipboard.writeText(text); b.textContent = 'اتنسخ ✓'; setTimeout(() => b.textContent = 'نسخ', 1500); } catch { c.querySelector('.label input').select(); }
    return;
  }
  if (b.dataset.pay) { choice[key(o)] = b.dataset.pay; render(); return; }
  if (b.dataset.act === 'auto') {
    const p = picks[key(o)] || {}, pay = choice[key(o)] || o.job?.payment || (o.payment === 'cash' || o.payment === 'paid' ? o.payment : null);
    if (!pay) { toast('حدد الأول: كاش ولا مدفوع'); return; }
    if (!p.branch) { toast('اختار فرع Apex'); return; }
    if (!p.loc) { toast('اختار منطقة العميل على Apex'); return; }
    if ((o.items || []).some((i, n) => !/^\d{4,10}$/.test(String(p.items?.[n] || '')))) { toast('كل صنف لازم يبقى له رقم على Apex'); return; }
    if (o.discounts?.some(d => !d.who)) { toast('فيه خصم مش واضح مين ممول له — سجله بإيدك'); return; }
    if (o.source === 'talabat' && o.items.some(i => !i.modifiersComplete)) { toast('الإضافات ماتقرتش كاملة — سجله بإيدك'); return; }
    const rest = (o.discounts || []).filter(d => d.who === 'restaurant').reduce((a, d) => a + (Number(d.amount) || 0), 0);
    const plat = (o.discounts || []).filter(d => d.who === 'platform');
    b.disabled = true;
    try {
      await api('POST', '/api/transfer/job', { source: o.source, ref: o.ref, action: 'auto', payment: pay, branchNo: Number(p.branch), locationNo: Number(p.loc), code: o.code,
        items: o.items.map((i, n) => ({ itemNo: p.items[n], qty: i.qty, note: (i.modifiers || []).join('، ').slice(0, 60) })),
        label: (o.customer?.name ? o.customer.name + ' ' : '') + labelOf(o, pay), customer: o.customer || {}, sign: plat.map(d => 'خصم طلبات ' + money(d.amount)).join(' + '),
        restaurantDiscount: rest, expectedTotal: (o.subtotal ?? o.total ?? 0) - rest });
      delete picks[key(o)]; await load();
    } catch (err) { toast(err.message); b.disabled = false; }
    return;
  }
  if (b.dataset.act) {
    const pay = choice[key(o)] || o.job?.payment || (o.payment === 'cash' || o.payment === 'paid' ? o.payment : null);
    if (b.dataset.act === 'entered' && !pay) { toast('حدد الأول: كاش ولا مدفوع'); return; }
    if (b.dataset.act === 'entered' && o.discounts?.some(d => !d.who) && !confirm('فيه خصم مش واضح مين ممول له. متأكد إنك سجلته صح؟')) return;
    b.disabled = true;
    try { await api('POST', '/api/transfer/job', { source: o.source, ref: o.ref, action: b.dataset.act, payment: pay }); await load(); }
    catch (err) { toast(err.message); b.disabled = false; }
  }
});
$('list').addEventListener('change', e => {
  const el = e.target.closest('[data-pick]'); if (!el) return;
  const c = el.closest('.card'), p = picks[c.dataset.k]; if (!p) return;
  if (el.dataset.pick === 'branch') { p.branch = el.value; p.loc = ''; render(); return; }
  if (el.dataset.pick === 'loc') p.loc = el.value;
  if (el.dataset.pick === 'item') { p.items[Number(el.dataset.n)] = el.value.trim(); const twin = c.querySelectorAll('[data-pick="item"][data-n="' + el.dataset.n + '"]'); twin.forEach(x => { if (x !== el) x.value = el.value.trim(); }); }
});
$('list').addEventListener('toggle', e => { const d = e.target.closest?.('[data-pick-box]'); if (d) { const p = picks[d.closest('.card').dataset.k]; if (p) p.open = d.open; } }, true);
async function load() {
  try { data = await api('GET', '/api/transfer/queue'); $('me').textContent = data.me.name; const a = $('auto'); a.textContent = { off: 'التحويل الآلي متوقف — سجّل على Apex بإيدك', shadow: 'التحويل الآلي: معاينة بس — سجّل بإيدك', test: 'التحويل الآلي: تجربة على قاعدة الاختبار — سجّل بإيدك', live: 'التحويل الآلي شغال' }[data.autoTransfer] || ''; a.className = 'pill' + (data.autoTransfer === 'live' ? '' : ' off'); if (!$('list').contains(document.activeElement) || !/^(INPUT|SELECT)$/.test(document.activeElement.tagName)) render(); }
  catch (e) { if (token) toast(e.message); }
}
function boot() { $('login').hidden = true; $('app').hidden = false; load(); }
if (token) boot(); else logout();
setInterval(() => { if (token && !document.hidden) load(); }, 20000);
</script>
