<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مرصد الدهان — تحويل الأوردرات</title>
<style>
#login>*{min-width:0;width:100%}#login input{text-align:center;font-size:18px}
@font-face{font-family:"Plex Arabic";src:url(../admin/fonts/plex-arabic-arabic-400.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Plex Arabic";src:url(../admin/fonts/plex-arabic-arabic-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Plex Arabic";src:url(../admin/fonts/plex-arabic-latin-400.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Plex Arabic";src:url(../admin/fonts/plex-arabic-latin-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}
:root{--bg:#081120;--panel:#0f1d33;--panel2:#13243f;--line:#1f3354;--text:#e2e8f0;--muted:#94a3b8;--accent:#2dd4bf;--on:#04201c;--tal:#ff7a00;--site:#38bdf8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Plex Arabic",Tahoma,Arial,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--on);font-weight:700;min-height:36px}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.on{background:var(--panel2);color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#0b1729;color:var(--text);min-height:38px}
header{position:sticky;top:0;z-index:5;background:#081120ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:18px;margin:0 0 0 auto}
.pill{border-radius:999px;padding:3px 10px;font-size:13px;border:1px solid var(--line);color:var(--muted)}
.pill.off{border-color:#7f1d1d;color:#fca5a5}
main{max-width:1100px;margin:0 auto;padding:16px}
#login{width:calc(100% - 32px);max-width:340px;margin:12vh auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:grid;gap:12px;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.count{color:var(--muted);font-size:13px;margin-inline-start:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;display:grid;gap:10px}
.card.done{opacity:.6}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.src{font-weight:700;border-radius:6px;padding:2px 8px;font-size:13px}
.src.talabat{background:#ff7a0022;color:var(--tal)} .src.site{background:#38bdf822;color:var(--site)}
.code{font-size:20px;font-weight:700;letter-spacing:.5px}
.state{margin-inline-start:auto;font-weight:700;font-size:14px}
.state.in{color:var(--ok)} .state.wait{color:var(--warn)} .state.mine{color:var(--accent)} .state.other{color:var(--bad)}
.label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel2);border-radius:10px;padding:8px 10px}
.label input{flex:1 1 100%;min-width:0;width:100%;font-weight:700;font-size:16px;text-overflow:clip}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.box{background:#0b1729;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.box h3{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:400}
.items{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.items li{background:#0b1729;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.mods{color:var(--muted);font-size:13px}
.apex{font-size:13px} .apex.none{color:var(--warn)}
.warn{color:var(--warn);font-size:13px} .bad{color:var(--bad)} .ok{color:var(--ok)}
.pay{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.copy{padding:4px 10px;min-height:30px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px}
#toast{position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:auto;background:#7f1d1d;color:#fff;padding:10px 14px;border-radius:10px;display:none}
@media (max-width:600px){header h1{font-size:16px}.code{font-size:18px}}
</style>
</head>
<body>
<section id="login" hidden>
  <h2 style="margin:0">تحويل الأوردرات للفروع</h2>
  <div style="color:var(--muted);font-size:14px">ادخل برقمك السري بتاع الشغل</div>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="الرقم السري">
  <button id="go">دخول</button>
  <div id="loginErr" class="bad" style="font-size:14px"></div>
</section>
<div id="app" hidden>
  <header>
    <h1>تحويل أوردرات طلبات والموقع</h1>
    <span id="auto" class="pill off" title="الصفحة دي مش بتكتب على Apex">التحويل الآلي متوقف لحد ما يتأكد — سجّل على Apex بإيدك</span>
    <span id="me" class="pill"></span>
    <button class="ghost" id="out">خروج</button>
  </header>
  <main>
    <div class="bar">
      <button data-f="todo" class="on">لسه ماتسجلش</button>
      <button data-f="all" class="ghost">الكل</button>
      <span style="width:12px"></span>
      <button data-s="" class="on">الكل</button>
      <button data-s="talabat" class="ghost">طلبات</button>
      <button data-s="site" class="ghost">الموقع</button>
      <span style="width:12px"></span>
      <span id="branchBar" class="bar" style="margin:0"></span>
      <span class="count" id="count"></span>
    </div>
    <div id="list"></div>
  </main>
</div>
<div id="toast"></div>
<script>
'use strict';
const API = '';
let token = null, data = null, filter = 'todo', source = '', choice = {}, picks = {}, branchPick = '';
try { branchPick = localStorage.getItem('marsadTransferBranch') || ''; } catch {}
try { token = sessionStorage.getItem('marsadTransfer'); } catch {}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n == null ? '' : Number(n).toLocaleString('ar-EG-u-nu-latn', { maximumFractionDigits: 2 });
const time = s => s ? new Date(s).toLocaleTimeString('ar-EG-u-nu-latn', { hour: 'numeric', minute: '2-digit', timeZone: 'Africa/Cairo' }) : '';
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 4000); }
async function api(method, path, body) {
  // A request that never answers (weak mobile data) ends after 25 s with a message instead of waiting forever.
  const ctl = typeof AbortController === 'function' ? new AbortController() : null, stop = ctl && setTimeout(() => ctl.abort(), 25000);
  let r;
  try { r = await fetch(API + path, { method, signal: ctl?.signal, headers: { 'content-type': 'application/json', ...(token ? { 'x-transfer-session': token } : {}) }, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error(e?.name === 'AbortError' ? 'السيرفر مردّش — النت ضعيف، جرّب تاني' : 'مفيش اتصال بالسيرفر — جرّب تاني'); }
  finally { if (stop) clearTimeout(stop); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/api/transfer/login') { logout(); $('loginErr').textContent = j.error || 'سجل دخول تاني'; throw new Error('سجل دخول تاني'); }
  if (!r.ok) throw new Error(j.error || 'حصل خطأ');
  return j;
}
function logout() { token = null; try { sessionStorage.removeItem('marsadTransfer'); } catch {} $('app').hidden = true; $('login').hidden = false; }
// Phones with an Arabic keyboard type ٠١٢٣ (Karim 01-11: «بدوس دخول مش بيدخل»): the PIN is turned into 0123 first,
// the button says it is working, a slow network ends in a message, and any failure is written under the button.
const latin = v => String(v || '').replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x660).replace(/[\u06F0-\u06F9]/g, d => d.charCodeAt(0) - 0x6F0).replace(/\D/g, '');
$('go').onclick = async () => {
  const go = $('go'), err = $('loginErr'), pin = latin($('pin').value);
  if (go.disabled) return;
  err.textContent = '';
  if (!pin) { err.textContent = 'اكتب الرقم السري (أرقام بس)'; return; }
  go.disabled = true; go.textContent = 'جاري الدخول…';
  const slow = setTimeout(() => { err.textContent = 'النت بطيء… لسه بيحاول'; }, 6000);
  try {
    const r = await api('POST', '/api/transfer/login', { pin });
    token = r.token; try { sessionStorage.setItem('marsadTransfer', token); } catch {}
    $('pin').value = ''; err.textContent = ''; boot();
  } catch (e) { err.textContent = e.message; }
  finally { clearTimeout(slow); go.disabled = false; go.textContent = 'دخول'; }
};
$('pin').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('out').onclick = logout;
document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; document.querySelectorAll('[data-f]').forEach(x => x.className = x === b ? 'on' : 'ghost'); render(true); });
$('branchBar').addEventListener('click', e => { const b = e.target.closest('[data-b]'); if (!b) return; branchPick = b.dataset.b; try { localStorage.setItem('marsadTransferBranch', branchPick); } catch {} render(true); });
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { source = b.dataset.s; document.querySelectorAll('[data-s]').forEach(x => x.className = x === b ? 'on' : 'ghost'); render(true); });

// What the employee writes next to the customer name on Apex.
// Apex keeps only the first 20 characters of the customer's name (checked 01-11: every Talabat order today was cut at 20,
// so «…#9981» became «…#9»). The #code goes first, then the payment, then the name, so the code is never lost.
function labelOf(o, pay) {
  const tag = o.code ? '#' + o.code + ' ' : '';
  if (o.source === 'talabat') return tag + (pay === 'paid' ? 'اطلب/مدفوع' : pay === 'cash' ? 'اطلب/كاش' : 'اطلب/؟؟');
  return tag + (pay === 'paid' ? 'مدفوع' : pay === 'cash' ? 'كاش' : '؟؟') + ' موقع';
}
const fullLabel = (o, pay) => labelOf(o, pay) + (o.customer?.name ? ' ' + o.customer.name : '');
const key = o => o.source + ':' + o.ref;
// What went wrong, in the words staff use (the writer reports Apex's technical message).
function plain(e) {
  const t = String(e || '').replace(/^Exception calling "\w+" with "\d+" argument\(s\): /, '').replace(/^"|"$/g, '');
  const M = [[/no delivery charge known/i, 'المنطقة دي ملهاش سعر توصيل على Apex — اختار المنطقة الصح'], [/far above/i, 'إجمالي Apex طالع أكتر من الأوردر — غالبًا صنف أو حجم غلط، راجع الأصناف'],
    [/below the order total/i, 'إجمالي Apex طالع أقل من الأوردر — فيه صنف ناقص أو حجم غلط، راجع الأصناف'], [/not in Apex Items|not in Apex$/i, 'فيه صنف مش موجود على Apex — اختار صنف تاني'],
    [/stopped on Apex/i, 'فيه صنف موقوف على Apex'], [/no price on Apex/i, 'فيه صنف ملوش سعر أونلاين على Apex'], [/business day is not open|no open day/i, 'يوم Apex لسه ما اتفتحش'],
    [/later day is open|stale/i, 'Apex فاتح يوم تاني — كلم المشرف'], [/timed out|Unable to connect|remote name|connection/i, 'Apex مش بيرد دلوقتي — جرب تاني بعد دقيقة'],
    [/Arithmetic overflow/i, 'Apex رفض الأوردر بسبب رقم مش مظبوط فيه — سجله بإيدك وبلغ المشرف'], [/no Apex order of this kind today/i, 'مفيش أوردر من النوع ده على Apex النهارده لسه — سجل أول واحد بإيدك'],
    [/فرق كبير|مش زي الأوردر/, null]];
  for (const [re, msg] of M) if (re.test(t)) return msg || t;
  return /[\u0600-\u06ff]/.test(t) ? t : 'حصلت مشكلة على Apex — سجله بإيدك وبلغ المشرف';
}
function stateOf(o) {
  if (o.apex) return { cls: 'in', text: 'في Apex ✓ ' + (o.apex.sn ? 'رقم ' + o.apex.sn : '#' + o.apex.no) + (o.apex.user ? ' — ' + o.apex.user : '') };
  const r = o.job?.result;
  if (o.job?.state === 'auto_pending') return { cls: 'wait', text: 'بيتبعت لـ Apex…' };
  if (o.job?.state === 'auto_sending') return { cls: 'wait', text: 'بيتكتب على Apex…' };
  if (o.job?.state === 'auto_done') return { cls: 'in', text: 'اتسجل على Apex ✓' + (r?.db === 'test' ? ' (تجربة)' : '') + ' رقم ' + (r?.shiftSerial ?? r?.orderNo ?? '') + (r?.error ? ' — ' + plain(r.error) : '') };
  if (o.job?.state === 'auto_failed') return { cls: 'other', text: 'ماتسجلش: ' + plain(r?.error) + ' — صلّحها وابعته تاني، أو سجله بإيدك' };
  if (o.job?.state === 'auto_preview') return { cls: r?.ok ? 'wait' : 'other', text: 'تجربة بس، ماتسجلش (كان هيطلع ' + money(r?.total) + ')' + (r?.error ? ' — ' + plain(r.error) : '') + ' — سجله بإيدك' };
  if (o.job?.state === 'entered') return { cls: 'wait', text: (o.job.mine ? 'إنت سجلته' : o.job.by + ' سجله') + ' — مستني يظهر في Apex' };
  if (o.job?.state === 'claimed') return o.job.mine ? { cls: 'mine', text: 'معاك دلوقتي' } : { cls: 'other', text: 'مع ' + o.job.by };
  if (o.out) return { cls: 'in', text: 'خرج مع الطيار (اتسجل قبل كده)' };
  return { cls: '', text: 'جديد' };
}
function payText(o) {
  if (o.payment === 'cash') return '<span class="ok">كاش (من بيانات الأوردر)</span>';
  if (o.payment === 'paid') return '<span class="ok">مدفوع (من بيانات الأوردر)</span>';
  if (o.payment === 'mixed') return '<span class="warn">مختلط: جزء أونلاين والباقي تحصيل كاش — راجع الأوردر واختار</span>';
  if (o.payment === 'unpaid') return '<span class="bad">أونلاين ولسه مادفعش — ماتسجلوش قبل الدفع</span>';
  return '<span class="warn">طريقة الدفع مش واضحة من المصدر — بص على الأوردر واختار</span>';
}
function discountsHtml(o) {
  if (!o.discounts?.length) return '<span style="color:var(--muted)">مفيش خصم ظاهر</span>';
  return o.discounts.map(d => {
    const where = d.who === 'platform' ? '<span class="ok">على حساب طلبات — مايتخصمش، بيتكتب في العلامة المميزة</span>'
      : d.who === 'restaurant' ? '<span class="ok">على حساب المطعم — يتخصم من الأوردر</span>' : '<span class="warn">مش واضح الخصم على حساب مين — اسأل المشرف قبل ما تسجل</span>';
    return '<div>' + esc(d.text) + (d.amount != null ? ' — ' + money(d.amount) : '') + '<br>' + where + '</div>';
  }).join('');
}
function itemsHtml(o) {
  if (!o.items?.length) return '<div class="warn">' + (o.detailRead ? 'مفيش أصناف' : 'تفاصيل الأوردر لسه ماوصلتش — بص عليه في ' + (o.source === 'talabat' ? 'طلبات' : 'الموقع')) + '</div>';
  return '<ul class="items">' + o.items.map(i => '<li><b>' + esc(i.qty) + '×</b> ' + esc(i.name) + (i.price != null ? ' <span style="color:var(--muted)">(' + money(i.price) + ')</span>' : '') +
    (i.sizeOption ? '<div class="mods">الحجم: ' + esc(i.sizeOption) + '</div>' : '') +
    ((i.freeOptions || [])?.length ? '<div class="mods">اختيارات ببلاش (تتكتب في تعليق الأوردر): ' + i.freeOptions.map(esc).join('، ') + '</div>' : '') +
    (i.addons?.length ? '<div class="warn">إضافات بفلوس (كل واحدة بتتسجل صنف لوحدها): ' + i.addons.map(a => esc(a.qty) + '× ' + esc(a.name) + ' (' + money(a.price) + ')' + (a.apex?.length ? ' → ' + a.apex.map(x => esc(x.no) + (x.name ? ' ' + esc(x.name) : '')).join(' أو ') : '')).join('، ') + '</div>' : '') +
    (o.source === 'talabat' && !i.modifiersComplete ? '<div class="warn">الإضافات مش ظاهرة كاملة — بص عليها في طلبات</div>' : '') +
    (o.source === 'talabat' ? (i.apex?.length ? '<div class="apex">على Apex: ' + i.apex.map(a => esc(a.no) + (a.name ? ' ' + esc(a.name) : '')).join(' أو ') + (i.apex.length > 1 ? ' <span class="warn">(اختار الحجم الصح)</span>' : '') + '</div>'
      : '<div class="apex none">لسه مش معروف على Apex — اختاره بالاسم</div>') : '') + '</li>').join('') + '</ul>';
}
// Automatic transfer: branch and Apex item for each line, confirmed by the employee (nothing is guessed).
// The Apex lines of an order: each dish, then each of its add-ons that cost money (its own Apex line, not a free note).
function flatLines(o) {
  const out = [];
  for (const i of o.items || []) {
    out.push({ kind: 'item', qty: i.qty, name: i.name, label: i.name + (i.sizeOption ? ' — ' + i.sizeOption : '') + ((i.freeOptions || []).length ? ' (' + i.freeOptions.join('، ') + ')' : ''), apex: i.apex || [], note: (i.freeOptions || []).join('، ').slice(0, 60) });
    for (const a of i.addons || []) out.push({ kind: 'addon', qty: a.qty ?? '?', name: a.name, label: '+ ' + a.name + ' (' + money(a.price) + ') — إضافة بفلوس على ' + i.name, apex: a.apex || [], note: '' });
  }
  return out;
}
// Talabat (or the site) against what Apex will come out at, before sending (Karim 01-11), all with tax as Talabat shows
// it: Apex's online price + 14% (Apex taxes items and delivery before the discount).
// The writer computes it again on Apex itself and stops on a big difference.
function compareHtml(o, fl, p) {
  const amt = t => { const m = String(t || '').split(' | ').slice(1).join(' ').replace(/,/g, '').match(/-?\d+(?:\.\d+)?/); return m ? Number(m[0]) : null; };
  const line = k => { const b = (o.bill || []).find(x => new RegExp(k, 'i').test(x.k || '')); return b ? amt(b.text) : null; };
  const r2 = v => Math.round(v * 100) / 100, f = v => v == null ? '<span style="color:var(--muted)">لسه</span>' : typeof v === 'string' ? v : money(r2(v));
  const rest = (o.discounts || []).filter(d => d.who === 'restaurant').reduce((a, d) => a + (Number(d.amount) || 0), 0);
  const plat = (o.discounts || []).filter(d => d.who === 'platform').reduce((a, d) => a + (Number(d.amount) || 0), 0);
  // Karim 01-11 («الفروقات دي بسبب إيه»): both sides line by line as they will really be recorded, and the reason in words.
  const pay = choice[key(o)] || o.job?.payment || (o.payment === 'cash' || o.payment === 'paid' ? o.payment : null), paid = pay === 'paid';
  const billRead = !!o.bill?.length, tItems = o.subtotal ?? line('^(?:المجموع الفرعي|subtotal)$'), tDel = line('توصيل|delivery') ?? (billRead ? 0 : null), tFee = line('رسوم الخدمة|service') ?? (billRead ? 0 : null);
  const tTotal = line('^(?:مجموع|total)$') ?? o.total;
  const want = o.target == null ? null : paid ? r2(o.target - plat) : o.target;   // paid: what the customer paid; cash: before Talabat's discount
  const tb = [['الأصناف', tItems], ['التوصيل', tDel], ['رسوم الخدمة', tFee], ['خصم المطعم', rest ? -rest : 0], ['خصم طلبات', plat ? -plat : 0], ['العميل ' + (paid ? 'دفع' : 'يدفع'), tTotal]];
  // Apex: online price + 14% tax, the «خدمة» line every Talabat order starts with, the area's delivery charge.
  let items = 0, missing = 0;
  fl.forEach((i, n) => { const pr = apexPrices.get(p.items[n]); if (pr == null || !p.items[n]) missing++; else items += pr * (Number(i.qty) || 1); });
  const fee = o.source === 'talabat' ? (apexPrices.get('0114006') || 7.02) : 0;
  const loc = (data.locations || []).find(l => String(l.no) === String(p.loc) && (l.branch == null || String(l.branch) === String(p.branch))) || (data.locations || []).find(l => String(l.no) === String(p.loc));
  const service = loc?.service ?? null;
  const T = v => r2(v * 1.14);

        note: [...flatLines(o).filter(i => i.kind === 'item' && i.note).map(i => i.name + ': ' + i.note), ...(o.note ? ['ملاحظة العميل: ' + o.note] : [])].join(' | ').slice(0, 300),
        // Paid (Karim 01-11): the whole discount comes off on Apex, so the Ledge equals what the customer paid.
        // Cash: the restaurant's comes off. Either way the special mark shows Talabat's discount only.
        label: fullLabel(o, pay), customer: o.customer || {},
        sign: plat.map(d => 'خصم طلبات ' + money(d.amount)).join(' + '),   // Karim 01-11: the special mark shows Talabat's discount only
        restaurantDiscount: pay === 'paid' ? rest + platSum : rest, expectedTotal: (o.subtotal ?? o.total ?? 0) - rest - (pay === 'paid' ? platSum : 0), targetTotal: o.target == null ? null : pay === 'paid' ? Math.round((o.target - platSum) * 100) / 100 : o.target });   // paid: what the customer paid (Talabat's discount off too)
      delete picks[key(o)]; await load();
    } catch (err) { toast(err.message); b.disabled = false; }
    return;
  }
  if (b.dataset.act) {
    const pay = choice[key(o)] || o.job?.payment || (o.payment === 'cash' || o.payment === 'paid' ? o.payment : null);
    if (b.dataset.act === 'entered' && !pay) { toast('حدد الأول: كاش ولا مدفوع'); return; }
    if (b.dataset.act === 'entered' && o.discounts?.some(d => !d.who) && !confirm('فيه خصم مش واضح مين ممول له. متأكد إنك سجلته صح؟')) return;
    b.disabled = true;
    try { await api('POST', '/api/transfer/job', { source: o.source, ref: o.ref, action: b.dataset.act, payment: pay }); await load(); }
    catch (err) { toast(err.message); b.disabled = false; }
  }
});
$('list').addEventListener('change', e => {
  const el = e.target.closest('[data-pick]'); if (!el) return;
  const c = el.closest('.card'), p = picks[c.dataset.k]; if (!p) return;
  if (el.dataset.pick === 'branch') {
    p.branch = el.value; p.moved = false;
    const a = areaList().find(l => String(l.no) === String(p.loc));
    if (a && a.branches.length && !a.branches.some(b => String(b) === String(p.branch))) { p.loc = ''; p.locGuess = false; }   // its area is another branch's
    render(true); return;
  }
  if (el.dataset.pick === 'loc') { pickArea(p, el.value); render(true); return; }
  if (el.dataset.pick === 'sec') { (p.secs || (p.secs = {}))[Number(el.dataset.n)] = el.value === '' ? null : Number(el.value); p.open = true; render(true); return; }
  if (el.dataset.pick === 'item') {
    const v = el.value.trim(); if (!v) return;
    // A name typed in the search box → its Apex number (an exact name, else the one name that contains what was typed).
    let no = v;
    if (el.dataset.find) { const all = data.apexItems || [], hit = all.find(a => a.name === v) || (all.filter(a => a.name.includes(v)).length === 1 ? all.find(a => a.name.includes(v)) : null) || all.find(a => a.no === v); if (!hit) { toast('الصنف ده مش في Apex — اختاره من القايمة'); return; } no = hit.no; }
    p.items[Number(el.dataset.n)] = no; p.open = true; render(true);
  }
});
$('list').addEventListener('focusout', () => setTimeout(() => { if (render.pending && !$('list').contains(document.activeElement)) render(); }, 0));
$('list').addEventListener('toggle', e => { const d = e.target.closest?.('[data-pick-box]'); if (d) { const p = picks[d.closest('.card').dataset.k]; if (p && p.open !== d.open) { p.open = d.open; if (d.open) render(true); } } }, true);
async function load() {
  try {
    // The Apex items and areas come once (and again only when they change): the page stays light.
    const prev = data, d = await api('GET', '/api/transfer/queue' + (prev?.staticKey ? '?have=' + encodeURIComponent(prev.staticKey) : ''));
    if (!d.apexItems && prev) { d.apexItems = prev.apexItems; d.locations = prev.locations; d.sections = prev.sections; }
    data = d; $('me').textContent = data.me.name; const a = $('auto'); a.textContent = { off: 'التحويل الآلي متوقف — سجّل على Apex بإيدك', shadow: 'التحويل الآلي: معاينة بس — سجّل بإيدك', test: 'التحويل الآلي: تجربة على قاعدة الاختبار — سجّل بإيدك', live: 'التحويل الآلي شغال' }[data.autoTransfer] || ''; a.className = 'pill' + (data.autoTransfer === 'live' ? '' : ' off'); if (!$('list').contains(document.activeElement) || !/^(INPUT|SELECT)$/.test(document.activeElement.tagName)) render(); }
  catch (e) { if (token) toast(e.message); }
}
function boot() { $('login').hidden = true; $('app').hidden = false; load(); }
if (token) boot(); else logout();
setInterval(() => { if (token && !document.hidden) load(); }, 20000);
</script>
