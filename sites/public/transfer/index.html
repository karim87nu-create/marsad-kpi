<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مرصد الدهان — تحويل الأوردرات</title>
<style>
#login>*{min-width:0;width:100%}#login input{text-align:center;font-size:18px}
@font-face{font-family:"Plex Arabic";src:url(../admin/fonts/plex-arabic-arabic-400.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Plex Arabic";src:url(../admin/fonts/plex-arabic-arabic-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Plex Arabic";src:url(../admin/fonts/plex-arabic-latin-400.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Plex Arabic";src:url(../admin/fonts/plex-arabic-latin-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}
:root{--bg:#081120;--panel:#0f1d33;--panel2:#13243f;--line:#1f3354;--text:#e2e8f0;--muted:#94a3b8;--accent:#2dd4bf;--on:#04201c;--tal:#ff7a00;--site:#38bdf8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Plex Arabic",Tahoma,Arial,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--on);font-weight:700;min-height:36px}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.on{background:var(--panel2);color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#0b1729;color:var(--text);min-height:38px}
header{position:sticky;top:0;z-index:5;background:#081120ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:18px;margin:0 0 0 auto}
.pill{border-radius:999px;padding:3px 10px;font-size:13px;border:1px solid var(--line);color:var(--muted)}
.pill.off{border-color:#7f1d1d;color:#fca5a5}
main{max-width:1100px;margin:0 auto;padding:16px}
#login{width:calc(100% - 32px);max-width:340px;margin:12vh auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:grid;gap:12px;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.count{color:var(--muted);font-size:13px;margin-inline-start:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;display:grid;gap:10px}
.card.done{opacity:.6}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.src{font-weight:700;border-radius:6px;padding:2px 8px;font-size:13px}
.src.talabat{background:#ff7a0022;color:var(--tal)} .src.site{background:#38bdf822;color:var(--site)}
.code{font-size:20px;font-weight:700;letter-spacing:.5px}
.state{margin-inline-start:auto;font-weight:700;font-size:14px}
.state.in{color:var(--ok)} .state.wait{color:var(--warn)} .state.mine{color:var(--accent)} .state.other{color:var(--bad)}
.label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel2);border-radius:10px;padding:8px 10px}
.label input{flex:1 1 100%;min-width:0;width:100%;font-weight:700;font-size:16px;text-overflow:clip}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.box{background:#0b1729;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
#calls{background:#2a1d05;border:1px solid var(--warn);border-radius:14px;padding:12px;margin-bottom:14px;display:grid;gap:10px}
#calls h2{margin:0;font-size:16px;color:var(--warn)}
#mine{background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:12px;margin-bottom:14px;display:grid;gap:10px}
#mine .k{background:#0b1729;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
#mine .k b{display:block;font-size:20px}
#mine .k.good{border-color:var(--ok)} #mine .k.bad{border-color:var(--bad)}
#mine .k small{color:var(--muted)}
#mineBoard .row{display:flex;gap:8px;padding:3px 8px;border-radius:8px} #mineBoard .row.me{background:var(--panel2);color:var(--accent);font-weight:700}
.call{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.call .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.call .why{white-space:pre-wrap;background:#0b1729;border-radius:8px;padding:6px 10px}
.call a.tel{color:var(--accent);font-weight:700;font-size:17px;direction:ltr;text-decoration:none}
.call input{flex:1 1 220px;min-width:0}
.box h3{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:400}
.items{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.items li{background:#0b1729;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.mods{color:var(--muted);font-size:13px}
.apex{font-size:13px} .apex.none{color:var(--warn)}
.warn{color:var(--warn);font-size:13px} .bad{color:var(--bad)} .ok{color:var(--ok)}
.pay{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.copy{padding:4px 10px;min-height:30px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px}
#toast{position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:auto;background:#7f1d1d;color:#fff;padding:10px 14px;border-radius:10px;display:none}
@media (max-width:600px){header h1{font-size:16px}.code{font-size:18px}}

/* the order card (redesigned 01-11): Apex's customer screen as fields, then the order as Apex will print it */
.card{gap:12px}
.head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.head .code{font-size:24px}
.when{color:var(--muted);font-size:14px}
.form{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.f{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line)}
.f:first-child{border-top:0}
.fl{color:var(--muted);font-size:13px}
.fv{min-width:0;overflow-wrap:anywhere}
.fv select{width:100%;max-width:320px}
.seg{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg button{padding:4px 12px;min-height:32px}
.cp{background:transparent;color:var(--accent);border:1px solid var(--line);padding:3px 10px;min-height:30px;font-size:13px;font-weight:400}
.muted{color:var(--muted);font-size:12px}
.ticket{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.tr{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ti{padding:6px 0;border-bottom:1px dashed var(--line)}
.ti.addon{padding-inline-start:14px}
.tsrc{color:var(--muted);font-size:12px} .tsrc.warn{color:var(--warn)}
.ticket .tr:not(.big){padding:3px 0}
.tag{color:var(--muted);font-size:12px}
.warnrow{color:var(--warn)}
.tt{border-top:1px solid var(--muted);margin-top:6px;padding-top:6px}
.tr.big{font-size:18px;font-weight:700}
.verdict{margin-top:6px}
.bill{margin-top:8px;color:var(--muted);font-size:12px}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pick select,.pick input{min-height:34px;flex:1 1 140px;min-width:0}
.link{background:none;border:0;color:var(--accent);padding:0 4px;min-height:0;font-size:12px;font-weight:700;text-decoration:underline}
.actions button.primary{flex:1 1 100%;min-height:46px;font-size:16px}
.src{background:var(--panel2)!important;border:1px solid var(--line)}
@media (max-width:600px){.f{grid-template-columns:70px 1fr auto}}
</style>
</head>
<body>
<section id="login" hidden>
  <h2 style="margin:0">تحويل الأوردرات للفروع</h2>
  <div style="color:var(--muted);font-size:14px">ادخل برقمك السري بتاع الشغل</div>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="الرقم السري">
  <button id="go">دخول</button>
  <div id="loginErr" class="bad" style="font-size:14px"></div>
</section>
<div id="app" hidden>
  <header>
    <h1>تحويل أوردرات طلبات والموقع</h1>
    <span id="auto" class="pill off" title="الصفحة دي مش بتكتب على Apex">جاري تحميل حالة التحويل…</span>
    <span id="me" class="pill"></span>
    <button class="ghost" id="mineBtn">📊 أرقامي</button>
    <button class="ghost" id="out">خروج</button>
  </header>
  <main>
    <div class="bar">
      <button data-f="todo" class="on">لسه ماتسجلش</button>
      <button data-f="all" class="ghost">الكل</button>
      <span style="width:12px"></span>
      <button data-s="" class="on">الكل</button>
      <button data-s="talabat" class="ghost">طلبات</button>
      <button data-s="site" class="ghost">الموقع</button>
      <span style="width:12px"></span>
      <span id="branchBar" class="bar" style="margin:0"></span>
      <span class="count" id="count"></span>
    </div>
    <section id="mine" hidden aria-label="أرقامي">
      <div class="bar"><b>أرقامي</b><button data-mine="day" class="ghost">النهارده</button><button data-mine="week" class="on">آخر 7 أيام</button><button data-mine="month" class="ghost">الشهر ده</button><span class="count" id="mineRank"></span></div>
      <div id="mineCards" class="grid"></div><div id="mineBoard"></div><div id="mineQa"></div>
    </section>
    <section id="calls" hidden aria-label="مكالمات مطلوبة من الفروع"></section>
    <p id="queueStatus" role="status">جاري تحميل الطلبات…</p>
    <div id="list"></div>
  </main>
</div>
<div id="toast"></div>
<script type="module">
import { deliveryLabel, deliveryAddress, deliveryComment } from "./delivery-fields.js";
'use strict';
const API = '';
let token = null, data = null, filter = 'todo', source = '', choice = {}, picks = {}, branchPick = '';
try { branchPick = localStorage.getItem('marsadTransferBranch') || ''; } catch {}
try { token = sessionStorage.getItem('marsadTransfer'); } catch {}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n == null ? '' : Number(n).toLocaleString('ar-EG-u-nu-latn', { maximumFractionDigits: 2 });
const time = s => s ? new Date(s).toLocaleTimeString('ar-EG-u-nu-latn', { hour: 'numeric', minute: '2-digit', timeZone: 'Africa/Cairo' }) : '';
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 4000); }
async function api(method, path, body) {
  // A request that never answers (weak mobile data) ends after 25 s with a message instead of waiting forever.
  const ctl = typeof AbortController === 'function' ? new AbortController() : null, stop = ctl && setTimeout(() => ctl.abort(), 25000);
  let r;
  try { r = await fetch(API + path, { method, signal: ctl?.signal, headers: { 'content-type': 'application/json', ...(token ? { 'x-transfer-session': token } : {}) }, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error(e?.name === 'AbortError' ? 'السيرفر اتأخر في الرد — جاري إعادة المحاولة' : 'تعذّر الوصول للموقع — حاول مرة تانية'); }
  finally { if (stop) clearTimeout(stop); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/api/transfer/login') { logout(); $('loginErr').textContent = j.error || 'سجل دخول تاني'; throw new Error('سجل دخول تاني'); }
  if (!r.ok) throw new Error(j.error || 'حصل خطأ');
  return j;
}
function logout() { token = null; try { sessionStorage.removeItem('marsadTransfer'); } catch {} $('app').hidden = true; $('login').hidden = false; }
// Phones with an Arabic keyboard type ٠١٢٣ (Karim 01-11: «بدوس دخول مش بيدخل»): the PIN is turned into 0123 first,
// the button says it is working, a slow network ends in a message, and any failure is written under the button.
const latin = v => String(v || '').replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x660).replace(/[\u06F0-\u06F9]/g, d => d.charCodeAt(0) - 0x6F0).replace(/\D/g, '');
$('go').onclick = async () => {
  const go = $('go'), err = $('loginErr'), pin = latin($('pin').value);
  if (go.disabled) return;
  err.textContent = '';
  if (!pin) { err.textContent = 'اكتب الرقم السري (أرقام بس)'; return; }
  go.disabled = true; go.textContent = 'جاري الدخول…';
  const slow = setTimeout(() => { err.textContent = 'لسه منتظرين رد السيرفر…'; }, 6000);
  try {
    const r = await api('POST', '/api/transfer/login', { pin });
    token = r.token; try { sessionStorage.setItem('marsadTransfer', token); } catch {}
    $('pin').value = ''; err.textContent = ''; boot();
  } catch (e) { err.textContent = e.message; }
  finally { clearTimeout(slow); go.disabled = false; go.textContent = 'دخول'; }
};
$('pin').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('out').onclick = logout;
document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; document.querySelectorAll('[data-f]').forEach(x => x.className = x === b ? 'on' : 'ghost'); render(true); });
$('branchBar').addEventListener('click', e => { const b = e.target.closest('[data-b]'); if (!b) return; branchPick = b.dataset.b; try { localStorage.setItem('marsadTransferBranch', branchPick); } catch {} render(true); });
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { source = b.dataset.s; document.querySelectorAll('[data-s]').forEach(x => x.className = x === b ? 'on' : 'ghost'); render(true); });

const fullLabel = (o, pay) => deliveryLabel(o.customer?.name, o.source, pay, o.code);
const key = o => o.source + ':' + o.ref;
// What went wrong, in the words staff use (the writer reports Apex's technical message).
function plain(e) {
  const t = String(e || '').replace(/^Exception calling "\w+" with "\d+" argument\(s\): /, '').replace(/^"|"$/g, '');
  const M = [[/no delivery charge known/i, 'المنطقة دي ملهاش سعر توصيل على Apex — اختار المنطقة الصح'], [/far above/i, 'إجمالي Apex طالع أكتر من الأوردر — غالبًا صنف أو حجم غلط، راجع الأصناف'],
    [/below the order total/i, 'إجمالي Apex طالع أقل من الأوردر — فيه صنف ناقص أو حجم غلط، راجع الأصناف'], [/not in Apex Items|not in Apex$/i, 'فيه صنف مش موجود على Apex — اختار صنف تاني'],
    [/stopped on Apex/i, 'فيه صنف موقوف على Apex'], [/no price on Apex/i, 'فيه صنف ملوش سعر أونلاين على Apex'], [/business day is not open|no open day/i, 'يوم Apex لسه ما اتفتحش'],
    [/later day is open|stale/i, 'Apex فاتح يوم تاني — كلم المشرف'], [/timed out|Unable to connect|remote name|connection/i, 'Apex مش بيرد دلوقتي — جرب تاني بعد دقيقة'],
    [/Arithmetic overflow/i, 'Apex رفض الأوردر بسبب رقم مش مظبوط فيه — سجله بإيدك وبلغ المشرف'], [/no Apex order of this kind today/i, 'مفيش أوردر من النوع ده على Apex النهارده لسه — سجل أول واحد بإيدك'],
    [/فرق كبير|مش زي الأوردر/, null]];
  for (const [re, msg] of M) if (re.test(t)) return msg || t;
  return /[\u0600-\u06ff]/.test(t) ? t : 'حصلت مشكلة على Apex — سجله بإيدك وبلغ المشرف';
}
function stateOf(o) {
  if (o.apex) return { cls: 'in', text: 'في Apex ✓ ' + (o.apex.sn ? 'رقم ' + o.apex.sn : '#' + o.apex.no) + (o.apex.user ? ' — ' + o.apex.user : '') };
  const r = o.job?.result;
  if (o.job?.state === 'auto_pending') return { cls: 'wait', text: 'بيتبعت لـ Apex…' };
  if (o.job?.state === 'auto_sending') return { cls: 'wait', text: 'بيتكتب على Apex…' };
  if (o.job?.state === 'auto_done') return { cls: 'in', text: 'اتسجل على Apex ✓' + (r?.db === 'test' ? ' (تجربة)' : '') + ' رقم ' + (r?.shiftSerial ?? r?.orderNo ?? '') + (r?.error ? ' — ' + plain(r.error) : '') };
  if (o.job?.state === 'auto_failed') return { cls: 'other', text: 'ماتسجلش: ' + plain(r?.error) + ' — صلّحها وابعته تاني، أو سجله بإيدك' };
  if (o.job?.state === 'auto_preview') return { cls: r?.ok ? 'wait' : 'other', text: 'تجربة بس، ماتسجلش (كان هيطلع ' + money(r?.total) + ')' + (r?.error ? ' — ' + plain(r.error) : '') + ' — سجله بإيدك' };
  if (o.job?.state === 'entered') return { cls: 'wait', text: (o.job.mine ? 'إنت سجلته' : o.job.by + ' سجله') + ' — مستني يظهر في Apex' };
  if (o.job?.state === 'claimed') return o.job.mine ? { cls: 'mine', text: 'معاك دلوقتي' } : { cls: 'other', text: 'مع ' + o.job.by };
  if (o.out) return { cls: 'in', text: 'خرج مع الطيار (اتسجل قبل كده)' };
  // The automatic transfer (11-11): what it decided about this order — sent by itself, would be (trial), or why it left it.
  if (o.auto?.decision === 'would') return { cls: 'wait', text: 'تجربة: المرصد كان هيحوّله لوحده' };
  if (o.auto?.decision === 'wait' && o.auto.why && !/^(?:لسه واصل|أوردر مجدول|تفاصيل الأوردر لسه ماوصلتش|لسه ما اتقبلش على طلبات)$/.test(o.auto.why)) return { cls: '', text: 'جديد — مش هيتحوّل آلي: ' + o.auto.why };
  return { cls: '', text: 'جديد' };
}
function payText(o) {
  if (o.payment === 'cash') return '<span class="ok">كاش (من بيانات الأوردر)</span>';
  if (o.payment === 'paid') return '<span class="ok">مدفوع (من بيانات الأوردر)</span>';
  if (o.payment === 'mixed') return '<span class="warn">مختلط: جزء أونلاين والباقي تحصيل كاش — راجع الأوردر واختار</span>';
  if (o.payment === 'unpaid') return '<span class="bad">أونلاين ولسه مادفعش — ماتسجلوش قبل الدفع</span>';
  return '<span class="warn">طريقة الدفع مش واضحة من المصدر — بص على الأوردر واختار</span>';
}
// Automatic transfer: branch and Apex item for each line, confirmed by the employee (nothing is guessed).
// The Apex lines of an order: each dish, then each of its add-ons that cost money (its own Apex line, not a free note).
// Karim 09-11: a discount on the customer's Apex card never stops the transfer and never passes unhandled.
function cardMoney(n) { return (n?.directives || []).filter(d => d.kind === 'percent' || d.kind === 'amount'); }
function cardUnclear(n) { return !!n && (n.unrecognized || cardMoney(n).length > 1); }
function cardWorth(o, p, n) {
  const m = cardMoney(n);
  if (m.length !== 1) return 0;
  if (m[0].kind === 'amount') return m[0].value;
  const base = flatLines(o).reduce((sum, i, k) => sum + (Number(apexPrices.get(String(p.items?.[k] || ''))) || 0) * (Number(i.qty) || 1), 0);
  return Math.round(base * m[0].value) / 100;
}
function giftChoices(worth) {
  if (!(worth > 0)) return [];
  return (data.apexItems || []).filter(a => a.price > 0 && a.price <= worth * 1.25 + 5 && !/خدم|الموقع|طلبات/.test(a.name))
    .sort((a, b) => Math.abs(a.price - worth) - Math.abs(b.price - worth)).slice(0, 10);
}
// Karim 10-11: more than one gift item (and more than one of each) until the total is near the discount.
function giftTotal(p) { return Object.entries(p.cardGifts || {}).reduce((sum, [no, q]) => sum + (Number(apexPrices.get(no)) || 0) * q, 0); }
const GIFT_ROOM = worth => worth * 1.25 + 5;
// One candidate, or the one the orders already on Apex used most for this dish (Karim 10-11).
const firstPick = i => i.apex?.length === 1 ? i.apex[0].no : i.apexPick && (i.apex || []).some(a => a.no === i.apexPick) ? i.apexPick : '';
function flatLines(o) {
  const out = [];
  for (const i of o.items || []) {

    const a = areaList().find(l => String(l.no) === String(p.loc));
    if (a && a.branches.length && !a.branches.some(b => String(b) === String(p.branch))) { p.loc = ''; p.locGuess = false; }   // its area is another branch's
    render(true); return;
  }
  if (el.dataset.pick === 'loc') { pickArea(p, el.value); render(true); return; }
  if (el.dataset.pick === 'sec') { (p.secs || (p.secs = {}))[Number(el.dataset.n)] = el.value === '' ? null : Number(el.value); p.open = true; render(true); return; }
  if (el.dataset.pick === 'item') {
    const v = el.value.trim(); if (!v) return;
    // A name typed in the search box → its Apex number (an exact name, else the one name that contains what was typed).
    let no = v;
    if (el.dataset.find) { const all = data.apexItems || [], hit = all.find(a => a.name === v) || (all.filter(a => a.name.includes(v)).length === 1 ? all.find(a => a.name.includes(v)) : null) || all.find(a => a.no === v); if (!hit) { toast('الصنف ده مش في Apex — اختاره من القايمة'); return; } no = hit.no; }
    const order = data.orders.find(o => key(o) === c.dataset.k), n = Number(el.dataset.n), line = flatLines(order)[n];
    el.disabled = true; p.saving = (p.saving || 0) + 1;
    try { await api('POST', '/api/transfer/selection', { source: order.source, ref: order.ref, line: n, choiceKey: line.choiceKey, itemNo: no }); }
    catch (err) { toast(err.message); el.disabled = false; return; }
    finally { p.saving--; }
    p.items[Number(el.dataset.n)] = no; if (p.edit) delete p.edit[Number(el.dataset.n)]; p.open = true; render(true);
  }
});
$('list').addEventListener('input', e => { const field = e.target.dataset.arabic; if (!field) return; const p = picks[e.target.closest('.card').dataset.k]; if (p) (p.arabic ||= {})[field] = e.target.value; });
$('list').addEventListener('focusout', () => setTimeout(() => { if (render.pending && !$('list').contains(document.activeElement)) render(); }, 0));
$('list').addEventListener('toggle', e => { const d = e.target.closest?.('[data-pick-box]'); if (d) { const p = picks[d.closest('.card').dataset.k]; if (p && p.open !== d.open) { p.open = d.open; if (d.open) render(true); } } }, true);
let loadingQueue = null;
function load() {
  if (loadingQueue) return loadingQueue;
  loadingQueue = loadQueue().finally(() => { loadingQueue = null; });
  return loadingQueue;
}
async function loadQueue() {
  try {
    // The Apex items and areas come once (and again only when they change): the page stays light.
    const prev = data, d = await api('GET', '/api/transfer/queue' + (prev?.staticKey ? '?have=' + encodeURIComponent(prev.staticKey) : ''));
    if (!d.apexItems && prev) { d.apexItems = prev.apexItems; d.locations = prev.locations; d.sections = prev.sections; }
    data = d; $('queueStatus').textContent = d.stale ? '⚠️ أحدث تحديث فشل — دي آخر بيانات محفوظة، والتحويل متوقف مؤقتًا لحد ما التحديث يرجع.' : ''; $('me').textContent = data.me.name; const a = $('auto'); a.textContent = { off: 'التحويل الآلي متوقف — سجّل على Apex بإيدك', shadow: 'التحويل الآلي: معاينة بس — سجّل بإيدك', test: 'التحويل الآلي: تجربة على قاعدة الاختبار — سجّل بإيدك', live: 'التحويل الآلي شغال' }[data.autoTransfer] || ''; a.className = 'pill' + (data.autoTransfer === 'live' ? '' : ' off'); render(); }
  catch (e) { if (token) { $('queueStatus').textContent = 'تعذّر تحديث الطلبات: ' + e.message + ' — جاري إعادة المحاولة'; if (!data) $('auto').textContent = 'حالة التحويل لم تصل بعد'; toast(e.message); } }
}
// Calls the branches asked for through the bot (Karim 11-11): the call center makes the call and records what the
// customer said; the bot tells the branch.
let calls = [], callsKey = '', callsSeen = new Set(), callsBusy = false;
async function loadCalls() {
  if (callsBusy) return; callsBusy = true;
  try {
    const d = await api('GET', '/api/bot/calls');
    calls = d.calls || []; renderCalls(d.outcomes || {});
    const fresh = calls.filter(c => !callsSeen.has(c.id)); calls.forEach(c => callsSeen.add(c.id));
    if (fresh.length && callsKey) beep();
    callsKey = callsKey || 'loaded';
  } catch {} finally { callsBusy = false; }
}
function beep() { try { const a = new AudioContext(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.value = .15; o.start(); setTimeout(() => { o.stop(); a.close(); }, 350); } catch {} }
function renderCalls(outcomes) {
  const box = $('calls');
  if (box.contains(document.activeElement) && document.activeElement.tagName !== 'BUTTON') return;   // never under the employee's typing
  const key = JSON.stringify(calls.map(c => [c.id, c.state, c.claimedBy, c.outcome, c.text]));
  if (key === box.dataset.key) return; box.dataset.key = key;
  box.hidden = !calls.length;
  if (!calls.length) { box.innerHTML = ''; return; }
  const mine = data?.me?.name;
  box.innerHTML = '<h2>📞 مكالمات مطلوبة من الفروع (' + calls.length + ')</h2>' + calls.map(c => {
    const o = c.order || {}, cu = o.customer || {}, phone = cu.phone || '';
    const taken = c.state === 'claimed' && c.claimedBy && c.claimedBy !== mine;
    return '<div class="call" data-call="' + c.id + '"><div class="row"><b>' + esc(c.kindLabel) + '</b><span class="pill">' + esc(c.branch || '') + '</span>' + (c.code ? '<span class="code">#' + esc(c.code) + '</span>' : '') +
      '<span class="pill">من ' + time(c.createdAt) + '</span>' + (c.outcome === 'no_answer' ? '<span class="pill off">اتصلنا ومردش</span>' : '') + (c.claimedBy ? '<span class="state ' + (taken ? 'other' : 'mine') + '">مع ' + esc(c.claimedBy) + '</span>' : '') + '</div>' +
      '<div class="why">' + esc(c.text || '') + '</div>' +
      '<div class="row">' + (cu.name ? '<span>' + esc(cu.name) + '</span>' : '') + (phone ? '<a class="tel" href="tel:' + esc(phone) + '">' + esc(phone) + '</a>' : '<span class="muted">التليفون مش ظاهر</span>') +
      (o.payment ? '<span class="pill">' + (o.payment === 'cash' ? 'كاش ' + money(o.target) : o.payment === 'paid' ? 'مدفوع' : esc(o.payment)) + '</span>' : '') + '</div>' +
      (o.items?.length ? '<div class="muted">' + o.items.map(i => esc(i.qty + '× ' + i.name + (i.size ? ' (' + i.size + ')' : ''))).join('، ') + '</div>' : '') +
      (taken ? '' : c.state !== 'claimed' ? '<div class="row"><button data-call-claim="' + c.id + '">هاتصل أنا</button></div>'
        : '<div class="row"><select data-call-outcome="' + c.id + '"><option value="">نتيجة المكالمة…</option>' + Object.entries(outcomes).map(([k, v]) => '<option value="' + k + '">' + esc(v) + '</option>').join('') + '</select>' +
          '<input data-call-note="' + c.id + '" placeholder="العميل قال إيه (هيوصل للفرع)" maxlength="400"><button data-call-save="' + c.id + '">سجّل وابعت للفرع</button></div>') + '</div>';
  }).join('');
}
$('calls').addEventListener('click', async e => {
  const claim = e.target.dataset.callClaim, save = e.target.dataset.callSave;
  if (!claim && !save) return;
  e.target.disabled = true;
  try {
    if (claim) await api('POST', '/api/bot/calls', { id: Number(claim), action: 'claim' });
    else {
      const outcome = document.querySelector('[data-call-outcome="' + save + '"]').value, note = document.querySelector('[data-call-note="' + save + '"]').value;
      if (!outcome) { toast('اختار نتيجة المكالمة'); e.target.disabled = false; return; }
      await api('POST', '/api/bot/calls', { id: Number(save), action: 'outcome', outcome, note });
      toast('اتسجلت واتبعتت للفرع');
    }
    $('calls').dataset.key = ''; document.activeElement?.blur?.(); await loadCalls();
  } catch (err) { toast(err.message); e.target.disabled = false; }
});
// أرقامي (Karim 11-11): the employee's own numbers against the targets, and where they stand in the team.
let mineRange = 'week';
const MINE = [['calls', 'مكالمات اترد عليها', ''], ['avgAnswerWait', 'متوسط انتظار العميل', 'ث'], ['conversionPct', 'مكالمات بقت أوردر', '%'], ['revenue', 'مبيعات مكالماتك', 'ج'], ['fcrPct', 'الحل من أول مكالمة', '%'],
  ['missedMine', 'فائتة كان ممكن تلحقها', ''], ['occupancy', 'الانشغال', '%'], ['breakPerDay', 'البريك في اليوم', 'د'], ['adherencePct', 'الالتزام بالشيفت', '%'], ['lateDays', 'أيام تأخير', ''], ['absentDays', 'غياب', ''], ['qaScore', 'درجة الجودة', '%']];
async function loadMine() {
  try {
    const d = await api('GET', '/api/me/kpi?range=' + mineRange), e = d.me || {}, b = d.before || {};
    $('mineRank').textContent = d.rank ? 'ترتيبك ' + d.rank + ' من ' + d.of : 'لسه مفيش أرقام كفاية للترتيب';
    const ok = (k, v) => { const t = d.targets[k]; if (!t || v == null) return ''; return (t.max != null && v > t.max) || (t.min != null && v < t.min) ? 'bad' : 'good'; };
    $('mineCards').innerHTML = MINE.map(([k, label, unit]) => { const v = e[k], t = d.targets[k];
      return '<div class="k ' + ok(k, v) + '"><small>' + esc(label) + '</small><b>' + (v == null ? '—' : esc(money(v)) + (unit ? ' ' + unit : '')) + '</b><small>' + (t ? 'الهدف ' + (t.min != null ? '≥ ' + t.min : '≤ ' + t.max) + (t.unit ? ' ' + t.unit : '') : '') + (b[k] != null ? ' · قبلها ' + esc(money(b[k])) : '') + '</small></div>'; }).join('');
    $('mineBoard').innerHTML = d.board.length ? '<b>الترتيب</b>' + d.board.map(x => '<div class="row' + (x.me ? ' me' : '') + '"><span>' + x.rank + '</span><span>' + esc(x.name) + '</span><span style="margin-inline-start:auto">' + x.score + '%</span></div>').join('') : '';
    $('mineQa').innerHTML = d.qa.length ? '<b>تقييمات الجودة</b>' + d.qa.map(q => '<div class="box">' + time(q.callAt) + ' — <b>' + q.total + '%</b> (' + esc(q.by) + ')' + (q.notes ? '<div class="muted">' + esc(q.notes) + '</div>' : '') + '</div>').join('') : '';
  } catch (err) { toast(err.message); }
}
$('mineBtn').onclick = () => { $('mine').hidden = !$('mine').hidden; if (!$('mine').hidden) loadMine(); };
$('mine').addEventListener('click', e => { const r = e.target.dataset.mine; if (!r) return; mineRange = r; for (const b of document.querySelectorAll('[data-mine]')) b.className = b.dataset.mine === r ? 'on' : 'ghost'; loadMine(); });
function boot() { $('login').hidden = true; $('app').hidden = false; load(); loadCalls(); }
if (token) boot(); else logout();
setInterval(() => { if (token && !document.hidden) { load(); loadCalls(); } }, 5000);
</script>
