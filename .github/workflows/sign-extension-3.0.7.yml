name: Sign and publish Firefox connector (v2 admin) 3.1.13

on:
  push:
    branches:
      - main
    paths:
      - 'extension-3/**'
      - '.github/workflows/sign-extension-3.0.7.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    env:
      AMO_KEY: ${{ secrets.AMO_JWT_ISSUER || secrets.WEB_EXT_API_KEY || secrets.AMO_API_KEY || secrets.MOZILLA_API_KEY }}
      AMO_SECRET: ${{ secrets.AMO_JWT_SECRET || secrets.WEB_EXT_API_SECRET || secrets.AMO_API_SECRET || secrets.MOZILLA_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install connector test dependencies
        working-directory: server
        run: npm ci
      - name: Verify Talabat transport and readers before signing
        working-directory: server
        run: node --test --test-force-exit test/talabat-transport.test.cjs test/talabat-reader.test.cjs test/whatsapp-sender.test.cjs test/audit-whatsapp.test.cjs
      - name: Validate extension 3 source
        run: |
          for f in extension-3/*.js; do node --check "$f"; done
          python -m json.tool extension-3/manifest.json >/dev/null
          test "$(python -c "import json;print(json.load(open('extension-3/manifest.json'))['version'])")" = "3.1.13"
      - name: Build unsigned audit package
        run: |
          rm -f arabicss-kpi-3.1.13-unsigned.xpi
          cd extension-3
          zip -qr ../arabicss-kpi-3.1.13-unsigned.xpi .
          cd ..
          unzip -t arabicss-kpi-3.1.13-unsigned.xpi >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: arabicss-kpi-3.1.13-unsigned-audit
          path: arabicss-kpi-3.1.13-unsigned.xpi
          retention-days: 14
      - name: Check signing credentials
        id: creds
        shell: bash
        run: |
          if [ -n "$AMO_KEY" ] && [ -n "$AMO_SECRET" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No AMO signing credentials are configured; the update feed will remain unchanged.'
            exit 1
          fi
      - name: Install Mozilla web-ext signer
        if: steps.creds.outputs.available == 'true'
        run: npm install --global web-ext
      - name: Sign unlisted 3.1.13 package with Mozilla
        if: steps.creds.outputs.available == 'true'
        run: |
          rm -rf signed-artifacts
          mkdir signed-artifacts
          web-ext sign --source-dir extension-3 --artifacts-dir signed-artifacts --api-key "$AMO_KEY" --api-secret "$AMO_SECRET" --channel unlisted
          python - <<'PY'
          from pathlib import Path
          files=list(Path('signed-artifacts').glob('*.xpi'))
          if len(files)!=1:
              raise SystemExit(f'expected one signed xpi, found {len(files)}')
          Path('signed-artifacts/selected.txt').write_text(str(files[0]))
          PY
          SIGNED=$(cat signed-artifacts/selected.txt)
          unzip -l "$SIGNED" | grep -q 'META-INF/mozilla.rsa'
      - uses: actions/upload-artifact@v4
        if: steps.creds.outputs.available == 'true'
        with:
          name: arabicss-kpi-3.1.13-signed
          path: signed-artifacts/*.xpi
          retention-days: 30
      - name: Publish signed package and update feed
        if: steps.creds.outputs.available == 'true'
        shell: bash
        run: |
          SIGNED=$(cat signed-artifacts/selected.txt)
          cp "$SIGNED" releases/arabicss-kpi-3.1.13.xpi
          SHA=$(sha256sum releases/arabicss-kpi-3.1.13.xpi | awk '{print $1}')
          python - "$SHA" <<'PY'
          import json,sys
          from pathlib import Path
          sha=sys.argv[1]
          p=Path('firefox-updates.json')
          data=json.loads(p.read_text())
          addon=data['addons']['arabicss-kpi@eldahan.local']
          updates=[u for u in addon.get('updates',[]) if u.get('version')!='3.1.13']
          updates.insert(0,{
              'version':'3.1.13',
              'update_link':'https://karim87nu-create.github.io/marsad-kpi/releases/arabicss-kpi-3.1.13.xpi',
              'update_hash':'sha256:'+sha,
              'applications':{'gecko':{'strict_min_version':'142.0'}}
          })
          addon['updates']=updates
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          r=Path('firefox-release.json');rel=json.loads(r.read_text());rel['version']='3.1.13';rel['sha256']=sha;r.write_text(json.dumps(rel,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp releases/arabicss-kpi-3.1.13.xpi arabicss-kpi-latest.xpi
          git add releases/arabicss-kpi-3.1.13.xpi arabicss-kpi-latest.xpi firefox-updates.json firefox-release.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish signed Firefox connector 3.1.13'
          git pull --rebase origin main
          git push origin HEAD:main

