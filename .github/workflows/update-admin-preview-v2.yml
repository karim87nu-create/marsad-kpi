name: Update admin preview v2
on:
  push:
    paths:
      - '.github/workflows/update-admin-preview-v2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch preview assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin-preview.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('admin-preview-v1.css?v=1.0.0','admin-preview-v2.css?v=2.0.0')
          if 'admin-preview-v2.js?v=2.0.0' not in s:
              s=s.replace('</body></html>','<script src="admin-preview-v2.js?v=2.0.0"></script></body></html>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit preview v2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-preview.html
          git diff --cached --quiet || git commit -m 'Switch admin preview to original colors and easier pages'
          git push
