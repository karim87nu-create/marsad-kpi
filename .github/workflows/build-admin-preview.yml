name: Build isolated admin preview
on:
  push:
    paths:
      - 'admin-preview-v1.css'
      - '.github/workflows/build-admin-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build preview from stable admin
        run: |
          cp admin.html admin-preview.html
          python - <<'PY'
          from pathlib import Path
          p=Path('admin-preview.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>مرصد الأداء | الإدارة</title>','<title>مرصد الأداء | معاينة التصميم</title>')
          s=s.replace('</head>','<link rel="stylesheet" href="admin-preview-v1.css?v=1.0.0"></head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit preview only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-preview.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build isolated admin redesign preview'
          git push
