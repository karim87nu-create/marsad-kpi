# مرصد الدهان على Cloudflare (Karim 07-11). Every push to main that touches the server or the pages is deployed;
# it can also be run by hand from Actions. Needs two repository secrets (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN  (a token from «Edit Cloudflare Workers» + D1 Edit)   CLOUDFLARE_ACCOUNT_ID
# and, once, MARSAD_ADMIN_PASSWORD (the admin page password). Nothing secret is printed.
name: Deploy to Cloudflare
on:
  push:
    branches: [main]
    paths: ['sites/lib/**', 'sites/public/**', 'cloudflare/**', '.github/workflows/deploy-cloudflare.yml']
  workflow_dispatch:
concurrency: { group: deploy-cloudflare, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check the secrets are set
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing"; exit 1; }
      - name: Install wrangler
        run: npm i -g wrangler@4.158.0
      - name: The D1 database «marsad» (created the first time)
        working-directory: cloudflare
        run: |
          id=$(wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="marsad");console.log(d?d.uuid:"")})')
          if [ -z "$id" ]; then
            wrangler d1 create marsad >/dev/null
            id=$(wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);console.log(l.find(x=>x.name==="marsad").uuid)})')
          fi
          sed -i "s/__D1_ID__/$id/" wrangler.toml
          echo "D1 ready"
      - name: Deploy
        working-directory: cloudflare
        run: wrangler deploy 2>&1 | tee deploy.log | grep -v -i token
      - name: Admin password (only when the secret is set)
        working-directory: cloudflare
        env: { PW: '${{ secrets.MARSAD_ADMIN_PASSWORD }}' }
        run: |
          if [ -n "$PW" ]; then printf '%s' "$PW" | wrangler secret put MARSAD_ADMIN_PASSWORD >/dev/null && echo "admin password set"; else echo "no MARSAD_ADMIN_PASSWORD secret — skipped"; fi
      - name: Health check
        working-directory: cloudflare
        run: |
          url=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -1)
          echo "Worker: $url"
          for i in 1 2 3 4 5 6; do curl -fsS "$url/api/health" && exit 0; sleep 5; done; exit 1
