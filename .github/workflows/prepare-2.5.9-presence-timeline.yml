name: Prepare connector 2.5.9 presence timeline

on:
  push:
    paths:
      - '.github/workflows/prepare-2.5.9-presence-timeline.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch connector source
        run: python scripts/prepare_connector_259.py
      - name: Validate source
        shell: bash
        run: |
          node --check extension-current/content.js
          node --check extension-current/page-hook.js
          python -m json.tool extension-current/manifest.json >/dev/null
          grep -q "VERSION='2.5.9'" extension-current/content.js
          grep -q '"version": "2.5.9"' extension-current/manifest.json
          grep -q 'presenceStateSince' extension-current/content.js
          grep -q 'stateTransition' extension-current/content.js
          grep -q 'captureArabicssStateEvidence' extension-current/content.js
      - name: Build unsigned package
        shell: bash
        run: |
          rm -f arabicss-kpi-2.5.9-unsigned.xpi
          cd extension-current
          zip -qr ../arabicss-kpi-2.5.9-unsigned.xpi . -x 'EVIDENCE-CAPTURE.md' 'SOURCE.txt' 'PRESENCE-TIMELINE-2.5.9.md'
          cd ..
          unzip -t arabicss-kpi-2.5.9-unsigned.xpi >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: arabicss-kpi-2.5.9-unsigned-audit
          path: arabicss-kpi-2.5.9-unsigned.xpi
          retention-days: 14
      - name: Commit source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension-current
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Track queue-entry availability timeline in connector 2.5.9'
          git push
