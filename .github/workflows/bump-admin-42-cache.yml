name: Bump admin 4.2 cache
on:
  push:
    paths:
      - '.github/admin42.trigger'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force new admin loader URL
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          s2=re.sub(r'admin-layout\.js\?v=[^"\']+', 'admin-layout.js?v=4.2.0', s)
          if s2==s:
              raise SystemExit('admin-layout.js version reference not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit cache-bust
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin.html
          git commit -m "Force admin 4.2 loader refresh"
          git push
