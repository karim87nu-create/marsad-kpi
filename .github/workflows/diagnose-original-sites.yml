name: Read-only probe intermittent original Sites 500s
on:
  push:
    branches: [diagnostic/sites-production-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Concurrent unauthenticated read probes, no response bodies
        shell: bash
        run: |
          set -euo pipefail
          base="https://marsad-v2.karim87nu.chatgpt.site"
          for route in /api/transfer/queue /api/orders/live /api/pulse; do
            echo "PATH $route"
            for i in $(seq 1 16); do
              curl -sS --connect-timeout 8 --max-time 20 -o /dev/null -w "$route HTTP=%{http_code} elapsed=%{time_total}\n" "$base$route" &
              if [ $((i % 4)) = 0 ]; then wait; fi
            done
            wait
          done
