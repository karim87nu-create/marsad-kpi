<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>موصل إدارة أرابيكس</title><style>body{font:16px Tahoma;background:#0d1b2c;color:white;width:370px;padding:18px;line-height:1.8}button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;font:inherit;border-radius:8px;background:#28d7b0;border:0;color:#07111f;cursor:pointer}button.secondary{background:#20384e;color:white;border:1px solid #42617a}p{color:#cbd5e1}#message{white-space:pre-line;min-height:2em}</style><h2>موصل أرابيكس</h2><p>المزامنة تتفعّل تلقائيًا عند تسجيل دخولك إلى صفحة الإدارة. لا تكتب باسورد الإدارة هنا؛ الإضافة لا تحفظه. يجب أن يكون Firefox مفتوحًا ومسجلًا في أرابيكس حتى يلتقط اللايف والسجل، وتستأنف المزامنة وحدها عند إعادة فتحه.</p><p id="message" role="status">جارٍ التحقق من حالة المزامنة…</p><button id="sync" class="secondary">مزامنة الآن</button><button id="stop" class="secondary">إيقاف المزامنة التلقائية</button><script src="collector.js"></script></html>
